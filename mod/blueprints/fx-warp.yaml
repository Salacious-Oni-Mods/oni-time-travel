# The world FxWarpRig measures the spacetime-warp screen pass in (--fx-warp).
#
# WHY THIS FILE EXISTS. A lens is only visible against straight lines, so the canvas is made of
# them: Sandstone stripes every 4 cells on Obsidian, two Granite pillars and a row of tiles, around an
# open hall of Oxygen. The emitter stands on the hall floor at (23, 6); the warp centre is 8 cells
# above it, at world (23.5, 14.5) in canvas terms, with a 9-cell radius that reaches both pillars,
# the tile row and the stripes beyond the hall walls. Nothing here is simulated against: no energy
# or mass claim, so no jacket.
name: FxWarp

canvas:
  width: 48
  height: 32
  background: Vacuum
  backgroundTemperature: 300.0
  border: Unobtanium
  borderThickness: 1
  zone: Sandstone
  startX: 24
  startY: 10

