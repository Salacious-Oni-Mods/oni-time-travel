# The world FxTimeRig shows the mock time machine in (--fx-time).
#
# The FXWARP canvas (Sandstone stripes every 4 cells on Obsidian, two Granite pillars, an open hall
# of Oxygen) with the time machine in place of the Warp Emitter: 4x4 on the hall floor, origin
# cell (23, 6), so it covers x 22..25, y 6..9. Its warp sits on the glass, 1.5 cells above the
# origin cell's centre, with a 4-cell radius that reaches the stripes either side. Nothing here
# is simulated against: no energy or mass claim, so no jacket.
name: FxTime

canvas:
  width: 48
  height: 32
  background: Vacuum
  backgroundTemperature: 300.0
  border: Unobtanium
  borderThickness: 1
  zone: Sandstone
  startX: 24
  startY: 10

regions:
  - name: block          # everything inside the border, solid Obsidian
    x: 1
    y: 1
    w: 46
    h: 30
