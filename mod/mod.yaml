title: "Time Travel"
description: "A duplicant takes a seat in the Time Machine, rides to a prehistoric twin of the home asteroid, and rides back after a cooldown. Pick the TIME TRAVEL card on a new game, build a Time Machine on Terra (its partner appears at the same place on the twin), select it and press Time Travel. One ride every 5 cycles. Needs the OniFramework.Library mod 1.2 or newer, Spaced Out! and The Prehistoric Planet Pack; does not need the OniFramework mod or the custom SimDLL."
staticID: "OniTimeTravel"
